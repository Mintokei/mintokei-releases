name: API Release

# Builds self-contained, single-file Mintokei.Api binaries from the PRIVATE
# source (Mintokei/mintokei, checked out via SOURCE_TOKEN) and publishes them —
# plus the deploy helpers (compose/Caddyfile/.env.example/install scripts) — to a
# draft release in THIS public repo, so the whole self-host bundle is publicly
# downloadable while the source stays private.
#
# Trigger manually with the release tag + the source ref to build.
# Required secret: SOURCE_TOKEN (read access to Mintokei/mintokei) — already set.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. api-v0.1.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref/sha in Mintokei/mintokei to build (e.g. master)'
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-22.04
          - rid: linux-arm64        # cross-arch publish from the x64 host (no R2R)
            runner: ubuntu-22.04
          - rid: win-x64
            runner: windows-latest
          - rid: osx-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Mintokei/mintokei
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API (self-contained, single file)
        shell: bash
        run: |
          dotnet publish src/Mintokei.Api/Mintokei.Api.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -o publish

      - name: Stage asset + checksum
        id: asset
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          name="mintokei-api-${{ matrix.rid }}$ext"
          mkdir -p dist
          cp "publish/Mintokei.Api$ext" "dist/$name"
          chmod +x "dist/$name" || true
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name" > "$name.sha256")
          else
            (cd dist && shasum -a 256 "$name" > "$name.sha256")
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (for deploy helpers)
        uses: actions/checkout@v4
        with:
          repository: Mintokei/mintokei
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src

      - name: Stage deploy helpers
        run: |
          mkdir -p deploy
          cp src/docker-compose.yml src/Caddyfile deploy/
          cp src/.env.example deploy/env.example
          cp src/scripts/install-server.sh src/scripts/install-runner.sh deploy/

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 'Mintokei API ${{ inputs.tag }}'
          draft: true
          prerelease: false
          make_latest: false      # desktop owns "latest" for the auto-updater
          files: |
            artifacts/*
            deploy/*
          body: |
            Self-contained Mintokei API binaries + the self-host deploy helpers.

            Built from Mintokei/mintokei@${{ inputs.source_ref }}.

            **Binaries** (verify with the matching `.sha256`):
            - Linux:   `mintokei-api-linux-x64`, `mintokei-api-linux-arm64`
            - Windows: `mintokei-api-win-x64.exe`
            - macOS:   `mintokei-api-osx-arm64` (Apple Silicon)

            **Self-host (Docker):** download `docker-compose.yml` + `.env.example`,
            set `DOMAIN`/`ACME_EMAIL`/`JWT_SIGNING_KEY`, then `docker compose up -d`
            (set `COMPOSE_PROFILES=tls` for bundled HTTPS via the included `Caddyfile`).
            Or run `install-server.sh`. Images: `ghcr.io/mintokei/mintokei-api`.

            The API binary serves REST + SignalR + WebSocket + gRPC. The container
            image also serves the WebApp UI.
